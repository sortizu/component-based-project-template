[plugin]

name="LogManager"
description="This addon provides:
- LogManager: An autoload that manages the creation  of new Loggers, objects that can be used to make logs.
- Logger: A class which offers functionalities to make logs and to control its frequency, order and format. It can be used as a simple manager of the log process, controlling the log requesters and showing messages depending on previous requesters and messages."
author="SORU"
version="1.0"
script="log_manager_plugin.gd"
